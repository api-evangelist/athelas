overlay: 1.0.0
info:
  title: API Evangelist enhancements for Athelas Enterprise API
  version: 1.0.0
extends: openapi/athelas-enterprise-openapi.yml
actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-07-18'
    x-apievangelist-source: https://athelas.readme.io/ (harvested per-operation OpenAPI blocks)
    x-artifacts:
      authentication: authentication/athelas-authentication.yml
      conventions: conventions/athelas-conventions.yml
      errors: errors/athelas-problem-types.yml
      data-model: data-model/athelas-data-model.yml
      webhooks: asyncapi/athelas-webhooks.yml
      sandbox: sandbox/athelas-sandbox.yml
- target: $.info
  update:
    x-authentication:
      style: bearer
      token_endpoint: /auth/login
      token_lifetime: 60 minutes
- target: $
  update:
    x-tags:
    - name: Patients
      description: Enroll, update, activate/deactivate, and read patients and their test results.
    - name: Sites
      description: Manage sites and their associated patients and prescribers.
    - name: Prescribers
      description: Manage prescribers (doctors) associated with sites.
    - name: Shipping
      description: Verify addresses and queue RPM devices for drop shipment.
