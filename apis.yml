aid: athelas
name: Athelas
description: >-
  Athelas (Commure d/b/a Athelas) is a healthcare technology company building AI-powered
  infrastructure for provider organizations, spanning remote patient monitoring (RPM),
  an AI-native EHR ("Air"), ambient AI scribing, and revenue cycle management (RCM /
  "Insights"). Its developer surface exposes two public APIs: the Athelas Enterprise
  RPM API (Bearer-token REST over api.athelas.com/enterprise/v1) for enrolling patients,
  managing sites and prescribers, shipping cellular-connected monitoring devices, and
  streaming device test results via webhook; and the Commure EHR FHIR API, an ONC
  (g)(10)-certified, US Core 6.1.0-compliant FHIR R4B server secured with SMART on FHIR
  v2 / OAuth2 for third-party app integrations with Air. Backed by General Catalyst and
  Initialized Capital; Athelas and Commure merged to form a multi-billion-dollar
  healthcare infrastructure company.
